# Evora : build web (wasm) de la branche evora/<tag-amont> du fork tazerty/designcraft.
#
# Écrit par Evora (patch EVORA-CIC-00) à partir de packaging/web/package.sh et packaging/env.sh de
# l'amont storytold/designcraft (MIT OR Apache-2.0). Rien n'est repris de storytold/craft-common-actions.
# Les workflows amont (freebsd, nix, packaging-lint, release, windows-arm64, et depuis v0.13.0 ci et
# sonarcloud) sont retirés de cette branche ; seul ce workflow y vit.
#
# Règles :
#   - seules actions : actions/checkout, actions/cache, actions/upload-artifact, actions/download-artifact,
#     épinglées par SHA de commit complet ; aucun secret ; jeton en lecture seule ;
#   - Rust installé par rustup, version épinglée (celle du job « Web (wasm) » de la release amont v0.13.0,
#     run 40195914881 : rustc 1.99.1, trunk 0.21.14, wasm-opt version_123 ; v0.9.0 : run 39087507233) ;
#   - Trunk, wasm-bindgen, wasm-opt et cargo-deny : binaires de release à version épinglée, vérifiés par
#     SHA-256 avant usage ; Trunk tourne hors ligne et ne peut pas modifier Cargo.lock ;
#   - cargo-about : bâti par cargo install --locked au commit épinglé CARGO_ABOUT_REV (EVORA-CIC-00-b) ;
#     la release 0.9.2 panique sur ce graphe (manifeste à texte non ASCII sans licence littérale) et ne
#     sert plus que de témoin rouge ; retour au binaire de release dès qu'une release porte le correctif ;
#   - runner ubuntu-24.04 sur les deux jobs (le libellé ubuntu-latest change le 2026-10-19) ;
#   - portes écrites par Evora (.github/evora/, Python de la bibliothèque standard).
#
# Portes BLOQUANTES : sources git de Cargo.lock (liste exacte des révisions) ; cargo-deny (avis RustSec,
# interdits, licences, sources) et son témoin ; cargo-about (LICENSES/) ; fichiers d'hébergement (aucun
# .htaccess, _headers, *.conf… dans l'artefact) ; témoins des détecteurs ; fumée Chrome depuis une autre
# origine (scénario « base ») et son témoin (.wasm absent : doit rougir). Depuis EVORA-CIC-01 à CIC-10 :
# marques dans le bundle (E1), nom amont dans les couches d'affichage (E1), liens sortants (E7, CIC-05),
# émojis (E10, CIC-06), absence de stockage (E5, CIC-04), fumée « pont-ehp » du pont natif (E4, CIC-07 à
# CIC-10, smoke_ehp.py).
# Portes en RAPPORT : termes (E9, CIC-11, en V2), taille (budget non arbitré), fumée sous la CSP cible,
# nom amont dans tout le bundle (couches moteur L1 à L5 : messages, profils, métadonnées des fichiers
# livrés, exception X-EXP-01 à venir).
# Témoins groupés : les portes bloquantes du job web et la porte des sources du verrou tournent toutes,
# même quand l'une rougit (continue-on-error) ; l'étape « Verdict des portes » rend l'ensemble exact des
# portes rouges et fait échouer le run avant l'archive (un run rouge ne publie aucun artefact du moteur).
#
# Sortie : artefact de run evora-layout-web-<tag> (archive evora-layout-web-<tag>.zip avec .br/.gz,
# LICENSES/ et EVORA-BUILD.txt ; SHA256SUMS ; csp-hashes.txt), slug de build Evora « layout » (D-P18 a,
# EVORA-CIC-01).
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pas de rust-toolchain(.toml) au tag ; rust-version = 1.95 dans Cargo.toml.
  RUST_TOOLCHAIN: "1.99.1"
  RUST_MIN_VERSION: "1.95"
  TRUNK_VERSION: "0.21.14"
  TRUNK_SHA256: "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"
  # Doit égaler la version de wasm-bindgen du Cargo.lock (Trunk l'exige).
  WASM_BINDGEN_VERSION: "0.2.129"
  WASM_BINDGEN_SHA256: "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e"
  BINARYEN_VERSION: "version_123"
  BINARYEN_SHA256: "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_ABOUT_VERSION: "0.9.2"
  # Binaire de release 0.9.2 : témoin rouge seulement (sa synthèse de manifeste insère à un index relatif
  # et panique sur « is_char_boundary » dès qu'un caractère multi-octet tombe à cet index ; c'est le cas
  # de crates/tools/Cargo.toml au tag v0.9.0).
  CARGO_ABOUT_SHA256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
  # cargo-about utilisé par la porte : commit de la branche principale d'EmbarkStudios/cargo-about du
  # 2026-09-18 qui porte les deux correctifs de synthesize_manifest (index rebasé, guillemet fermant) ;
  # le Cargo.toml de ce commit annonce encore 0.9.2. Aucune release ne les porte au 2026-10-19.
  CARGO_ABOUT_REV: "d7c169da07c684c5a80f75aab8a1dd7df660bc4b"
  # craft-fonts : commit passé par l'amont lui-même (release.yml au tag, ligne craft-fonts-ref ;
  # a71c20e3 à v0.13.0, abb83316 à v0.9.0).
  CRAFT_FONTS_REF: "a71c20e30af613287c504f7e685ca8fad77752bc"
  # Slug de build Evora de cette application (D-P18 a) ; consigné dans EVORA-BUILD.txt.
  EVORA_BUILD_SLUG: "layout"
  WEB_MANIFEST: "apps/designcraft-web/Cargo.toml"

jobs:
  licences:
    name: Licences, avis et sources (cargo-deny, cargo-about)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout de la branche Evora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Témoins des détecteurs (chaque porte voit ce qu'on y plante)
        run: python3 -I .github/evora/gates.py witness

      - name: Rust (rustup, version épinglée)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          case "$(rustc -V)" in
            "rustc $RUST_TOOLCHAIN "*) ;;
            *) echo "::error::rustc n'est pas $RUST_TOOLCHAIN : $(rustc -V)"; exit 1 ;;
          esac

      - name: cargo-deny et release de cargo-about (binaires de release vérifiés par SHA-256)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/evora-tools"
          mkdir -p "$TOOLS/bin" "$TOOLS/witness" "$TOOLS/dl/deny" "$TOOLS/dl/about"
          fetch() { # url sha256 fichier
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$TOOLS/dl/$3" "$1"
            echo "$2  $TOOLS/dl/$3" | sha256sum -c -
          }
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$CARGO_DENY_SHA256" deny.tar.gz
          fetch "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$CARGO_ABOUT_SHA256" about.tar.gz
          tar -xzf "$TOOLS/dl/deny.tar.gz" -C "$TOOLS/dl/deny"
          tar -xzf "$TOOLS/dl/about.tar.gz" -C "$TOOLS/dl/about"
          install -m 0755 "$(find "$TOOLS/dl/deny" -type f -name cargo-deny -print -quit)" "$TOOLS/bin/cargo-deny"
          # Hors du PATH : ce binaire ne sert qu'au témoin rouge de la porte cargo-about.
          install -m 0755 "$(find "$TOOLS/dl/about" -type f -name cargo-about -print -quit)" "$TOOLS/witness/cargo-about-release"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          "$TOOLS/bin/cargo-deny" --version | grep -q " ${CARGO_DENY_VERSION}\$" || { echo "::error::version de cargo-deny inattendue"; exit 1; }
          "$TOOLS/witness/cargo-about-release" --version | grep -q " ${CARGO_ABOUT_VERSION}\$" || { echo "::error::version de la release de cargo-about inattendue"; exit 1; }

      - name: Cache de cargo-about bâti (lecture)
        id: about_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-cargo-about
          key: evora-cargo-about-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-${{ env.CARGO_ABOUT_REV }}-cli-nolto

      - name: cargo-about bâti au commit épinglé (cargo install --locked)
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          set -euo pipefail
          root="$HOME/.evora-cargo-about"
          if [ ! -x "$root/bin/cargo-about" ]; then
            # Hors de l'espace de travail amont : aucune configuration cargo du dépôt ne s'applique.
            (cd "$RUNNER_TEMP" && cargo install cargo-about --git https://github.com/EmbarkStudios/cargo-about \
              --rev "$CARGO_ABOUT_REV" --locked --features cli --root "$root")
          fi
          # Le registre de cargo install nomme la source exacte : version annoncée et commit résolu.
          ver_re="$(printf '%s' "$CARGO_ABOUT_VERSION" | sed 's/[.]/[.]/g')"
          if ! grep -qE "^\"cargo-about ${ver_re} [(]git[+]https://github[.]com/EmbarkStudios/cargo-about[^#\"]*#${CARGO_ABOUT_REV}[)]\"" "$root/.crates.toml"; then
            cat "$root/.crates.toml"; echo "::error::cargo-about installé ne vient pas du commit $CARGO_ABOUT_REV"; exit 1
          fi
          install -m 0755 "$root/bin/cargo-about" "$RUNNER_TEMP/evora-tools/bin/cargo-about"
          "$RUNNER_TEMP/evora-tools/bin/cargo-about" --version | grep -q " ${CARGO_ABOUT_VERSION}\$" || { echo "::error::version de cargo-about inattendue"; exit 1; }
          echo "cargo-about : commit $CARGO_ABOUT_REV ($(grep -F 'cargo-about ' "$root/.crates.toml"))"

      - name: Cache de cargo-about bâti (écriture)
        if: steps.about_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-cargo-about
          key: ${{ steps.about_cache.outputs.cache-primary-key }}

      # Témoin : une crate dont le manifeste hérite sa licence de l'espace de travail et porte un caractère
      # multi-octet à l'index où la release 0.9.2 insère la licence synthétisée (même forme que
      # crates/tools/Cargo.toml au tag). La release doit y paniquer, et seulement là ; le binaire épinglé
      # doit passer. Sinon le témoin ne prouve rien et le job rougit.
      - name: Témoin de la porte cargo-about (release 0.9.2 rouge, commit épinglé vert)
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/evora-about-temoin"
          python3 -I - "$w" <<'PY'
          import os, sys
          w = sys.argv[1]
          files = {
              "Cargo.toml": '[workspace]\nmembers = ["racine", "outil"]\nresolver = "2"\n\n'
                            '[workspace.package]\nlicense = "MIT"\n',
              "racine/Cargo.toml": '[package]\nname = "evora-temoin-racine"\nversion = "0.1.0"\nedition = "2021"\n'
                                   'license.workspace = true\npublish = false\n\n[dependencies]\n'
                                   'evora-temoin-outil = { path = "../outil" }\n',
              "outil/Cargo.toml": '[package]\nname = "evora-temoin-outil"\nversion = "0.1.0"\nedition = "2021"\n'
                                  'license.workspace = true\n'
                                  'description = "Temoin Evora de cargo-about (Zoom\u2026)"\n\n[dependencies]\n',
              "racine/src/lib.rs": "",
              "outil/src/lib.rs": "",
              "about.toml": 'accepted = ["MIT"]\n',
              "about.hbs": "{{#each licenses}}{{id}}\n{{/each}}",
          }
          for rel, text in files.items():
              path = os.path.join(w, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(text)
          # L'index d'insertion de la release : relatif à « [package] » + 5, appliqué au fichier entier.
          data = open(os.path.join(w, "outil/Cargo.toml"), "rb").read()
          blank = data.index(b"\n\n") + 1  # début de la première ligne vide
          idx = blank - (data.index(b"[package]") + 5)
          if b"MIT" in data or (data[idx] & 0xC0) != 0x80:
              sys.exit("témoin mal formé : l'index de la release ne tombe pas dans un caractère multi-octet")
          PY
          run() { "$1" generate --manifest-path "$w/racine/Cargo.toml" -c "$w/about.toml" -o "$w/$2.txt" "$w/about.hbs" > "$w/$2.log" 2>&1; }
          rc=0; run "$RUNNER_TEMP/evora-tools/witness/cargo-about-release" release || rc=$?
          if [ "$rc" = 101 ] && grep -q 'src/licenses/resolution.rs' "$w/release.log" && grep -q 'is_char_boundary' "$w/release.log"; then
            echo "Témoin rouge OK : la release $CARGO_ABOUT_VERSION panique sur le manifeste témoin (code $rc)"
          else
            cat "$w/release.log"; echo "::error::témoin cargo-about : la release ne panique pas comme attendu (code $rc), le témoin ne prouve rien"; exit 1
          fi
          rc=0; run "$RUNNER_TEMP/evora-tools/bin/cargo-about" epingle || rc=$?
          if [ "$rc" = 0 ] && grep -qx 'MIT' "$w/epingle.txt"; then
            echo "Témoin vert OK : le commit $CARGO_ABOUT_REV passe le même manifeste"
          else
            cat "$w/epingle.log"; echo "::error::témoin cargo-about : le binaire épinglé échoue sur le manifeste témoin (code $rc)"; exit 1
          fi

      - name: Sources git du verrou (liste exacte des révisions ; bloquante)
        id: lock_sources
        continue-on-error: true
        run: python3 -I .github/evora/gates.py lock-sources Cargo.lock .github/evora/git-sources.txt "$GITHUB_STEP_SUMMARY"

      - name: Dépendances cargo (Cargo.lock verrouillé)
        run: cargo fetch --locked

      # Témoin : une copie de deny.toml dont allow-git n'admet plus storytold/indd-utils doit faire
      # rougir la catégorie « sources », et sur indd-utils seulement.
      - name: Porte cargo-deny (avis, interdits, licences, sources ; bloquante) et son témoin
        run: |
          set -euo pipefail
          deny() { cargo deny --manifest-path "$WEB_MANIFEST" --config "$1" --locked --color never check --show-stats "${@:2}"; }
          deny .github/evora/deny.toml advisories bans licenses sources 2>&1 | tee "$RUNNER_TEMP/cargo-deny.log"
          sab="$RUNNER_TEMP/deny-sabotage.toml"
          log="$RUNNER_TEMP/deny-sabotage.log"
          python3 -I - .github/evora/deny.toml "$sab" <<'PY'
          import sys
          src, dst = sys.argv[1:]
          text = open(src, encoding="utf-8").read()
          line = '    "https://github.com/storytold/indd-utils",\n'
          if text.count(line) != 1:
              sys.exit(f"allow-git storytold/indd-utils introuvable ou multiple dans {src}")
          open(dst, "w", encoding="utf-8").write(text.replace(line, ""))
          PY
          if deny "$sab" sources > "$log" 2>&1; then
            cat "$log"; echo "::error::témoin cargo-deny : une source git non admise (indd-utils) passe la porte"; exit 1
          fi
          ncodes="$(grep -oE '^error\[[a-z0-9-]+\]' "$log" | sort -u | wc -l | tr -d ' ' || true)"
          if grep -q 'sources FAILED' "$log" && grep -q 'indd-utils' "$log" && ! grep -qE 'craft-libs|pdfcraft' "$log" && [ "$ncodes" = 1 ]; then
            echo "Témoin cargo-deny OK : $(grep -c '^error\[' "$log") erreur(s) sur storytold/indd-utils seulement"
          else
            cat "$log"; echo "::error::témoin cargo-deny : le rouge ne porte pas exactement sur la source retirée"; exit 1
          fi
          {
            echo "### cargo-deny $CARGO_DENY_VERSION (bloquante)"
            echo
            echo "Avertissements : $(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/cargo-deny.log" | grep -c '^warning\[' || true) ; témoin des sources (indd-utils retiré) : rouge attendu."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Licences des dépendances (cargo-about ; bloquante)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evora-about"
          out="$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt"
          cargo about generate --manifest-path "$WEB_MANIFEST" --locked --fail \
            -c .github/evora/about.toml -o "$out" .github/evora/about.hbs
          [ -s "$out" ] || { echo "::error::cargo-about n'a rien produit"; exit 1; }
          echo "THIRD-PARTY-LICENSES.txt : $(wc -c < "$out") octets"
          sed -n '/^Vue d.ensemble/,/^====/p' "$out"

      - name: Licences pour le job web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evora-licences
          path: ${{ runner.temp }}/evora-about/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verdict de la porte des sources du verrou
        env:
          LOCK_SOURCES: ${{ steps.lock_sources.outcome }}
        run: |
          if [ "$LOCK_SOURCES" != "success" ]; then
            echo "PORTES ROUGES : sources-du-verrou"
            echo "::error::porte des sources du verrou rouge"
            exit 1
          fi
          echo "PORTES ROUGES : aucune"

  web:
    name: Build web (wasm32), portes et fumée
    needs: licences
    # Témoins groupés : le job web tourne aussi quand seule la porte des sources du verrou a rougi.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout de la branche Evora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Absence de stockage du moteur (EVORA-CIC-04 ; bloquante)
        id: storage
        continue-on-error: true
        run: python3 -I .github/evora/gates.py storage-guard apps/designcraft-web/Cargo.toml Cargo.toml "$GITHUB_STEP_SUMMARY"

      - name: Checkout de craft-fonts (commit épinglé)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: evora-ci/craft-fonts
          persist-credentials: false

      - name: Tag amont et nom de l'artefact
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_NAME" in
            evora/*) TAG="${REF_NAME#evora/}" ;;
            *) echo "::error::branche inattendue : $REF_NAME (attendu : evora/<tag amont>)"; exit 1 ;;
          esac
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag amont invalide : $TAG"; exit 1; }
          # Même lecture que packaging/env.sh : [workspace.package] version du Cargo.toml racine.
          VERSION="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") ; next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          [ "v$VERSION" = "$TAG" ] || { echo "::error::Cargo.toml annonce $VERSION alors que la branche vise $TAG"; exit 1; }
          have="$(git -C evora-ci/craft-fonts rev-parse HEAD)"
          [ "$have" = "$CRAFT_FONTS_REF" ] || { echo "::error::craft-fonts au commit $have, épinglé $CRAFT_FONTS_REF"; exit 1; }
          {
            echo "tag=$TAG"
            echo "name=evora-layout-web-$TAG"
            echo "commit=$(git rev-parse HEAD)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "report=$RUNNER_TEMP/evora-portes.md"
          } >> "$GITHUB_OUTPUT"
          printf '## Evora : build web %s\n\nCommit `%s` ; craft-fonts `%s`.\n\n' "$TAG" "$(git rev-parse HEAD)" "$CRAFT_FONTS_REF" > "$RUNNER_TEMP/evora-portes.md"

      - name: Rust (rustup, version épinglée) et cible wasm32
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          have="$(rustc -V | awk '{print $2}')"
          [ "$have" = "$RUST_TOOLCHAIN" ] || { echo "::error::rustc $have au lieu de $RUST_TOOLCHAIN"; exit 1; }
          printf '%s\n%s\n' "$RUST_MIN_VERSION" "$have" | sort -V -C || { echo "::error::rustc $have plus ancien que $RUST_MIN_VERSION"; exit 1; }

      - name: Cache cargo (registre, dépôts git, target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: evora-web-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-

      - name: Outils épinglés (Trunk, wasm-bindgen, wasm-opt ; SHA-256 vérifiés)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/evora-tools"
          mkdir -p "$TOOLS/dl" "$TOOLS/bin" "$TOOLS/trunk" "$TOOLS/wasm-bindgen" "$TOOLS/binaryen"
          fetch() { # url sha256 destination
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            "$TRUNK_SHA256" "$TOOLS/dl/trunk.tar.gz"
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$WASM_BINDGEN_SHA256" "$TOOLS/dl/wasm-bindgen.tar.gz"
          fetch "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            "$BINARYEN_SHA256" "$TOOLS/dl/binaryen.tar.gz"
          tar -xzf "$TOOLS/dl/trunk.tar.gz" -C "$TOOLS/trunk"
          tar -xzf "$TOOLS/dl/wasm-bindgen.tar.gz" -C "$TOOLS/wasm-bindgen"
          tar -xzf "$TOOLS/dl/binaryen.tar.gz" -C "$TOOLS/binaryen"
          install -m 0755 "$(find "$TOOLS/trunk" -type f -name trunk -print -quit)" "$TOOLS/bin/trunk"
          install -m 0755 "$(find "$TOOLS/wasm-bindgen" -type f -name wasm-bindgen -print -quit)" "$TOOLS/bin/wasm-bindgen"
          # wasm-opt reste dans l'arbre binaryen (il peut y chercher ../lib).
          WASM_OPT="$(find "$TOOLS/binaryen" -type f -name wasm-opt -print -quit)"
          [ -x "$WASM_OPT" ] || { echo "::error::wasm-opt introuvable dans l'archive binaryen"; exit 1; }
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          dirname "$WASM_OPT" >> "$GITHUB_PATH"

      - name: Vérification des versions d'outils
        run: |
          set -euo pipefail
          trunk --version | grep -qx "trunk ${TRUNK_VERSION}" || { echo "::error::version de trunk inattendue"; exit 1; }
          wasm-bindgen --version | grep -qx "wasm-bindgen ${WASM_BINDGEN_VERSION}" || { echo "::error::version de wasm-bindgen inattendue"; exit 1; }
          wasm-opt --version | grep -q "(${BINARYEN_VERSION})" || { echo "::error::version de wasm-opt inattendue"; exit 1; }
          lock="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          [ "$lock" = "$WASM_BINDGEN_VERSION" ] || { echo "::error::Cargo.lock exige wasm-bindgen $lock, le workflow épingle $WASM_BINDGEN_VERSION"; exit 1; }

      - name: Dépendances cargo (Cargo.lock verrouillé)
        run: cargo fetch --locked

      - name: Build web release (trunk hors ligne)
        working-directory: apps/designcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/evora-ci/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          TRUNK_TOOLS_WASM_BINDGEN: ${{ env.WASM_BINDGEN_VERSION }}
          TRUNK_TOOLS_WASM_OPT: ${{ env.BINARYEN_VERSION }}
        run: |
          set -euo pipefail
          # --offline=true : sans valeur, l'option globale de Trunk avalerait la sous-commande.
          trunk --offline=true build --release --locked
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- Cargo.lock || { echo "::error::le build a modifié Cargo.lock"; exit 1; }

      - name: Licences des dépendances (du job licences)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evora-licences
          path: ${{ runner.temp }}/evora-about

      - name: Empaquetage du site statique (logique de packaging/web/package.sh, sans fichiers d'hébergement)
        id: pkg
        env:
          NAME: ${{ steps.meta.outputs.name }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/evora-ci/craft-fonts
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/dist/web"
          [ -f "$SITE/index.html" ] || { echo "::error::$SITE/index.html absent après trunk build"; exit 1; }
          # Même contrôle que package.sh : des URL relatives, pour servir le site sous n'importe quel préfixe.
          if grep -Eq '(src|href)="/[^/]' "$SITE/index.html"; then
            echo "::error::index.html contient des URL absolues à la racine"; exit 1
          fi
          WORK="$(mktemp -d)"
          PKG="$WORK/$NAME"
          OUT="$GITHUB_WORKSPACE/evora-ci/out"
          mkdir -p "$PKG/LICENSES" "$OUT"
          cp -R "$SITE/." "$PKG/"
          # Différences voulues avec package.sh : ni _headers, ni .htaccess, ni HOSTING.md (l'hébergement
          # est celui d'Evora), ni README.md ; licences rangées sous LICENSES/.
          for f in LICENSE-MIT LICENSE-APACHE NOTICE ASSETS.md; do
            if [ -f "$f" ]; then cp "$f" "$PKG/LICENSES/"; fi
          done
          # Licences des polices craft-fonts embarquées (logique de copy_font_licences, packaging/env.sh).
          for f in "$CRAFT_FONTS_DIR"/fonts/*/OFL.txt; do
            if [ -f "$f" ]; then cp "$f" "$PKG/LICENSES/OFL-$(basename "$(dirname "$f")").txt"; fi
          done
          cp "$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt" "$PKG/LICENSES/THIRD-PARTY-LICENSES.txt"
          {
            echo "artefact: $NAME"
            echo "slug-evora: $EVORA_BUILD_SLUG"
            echo "depot: $GITHUB_REPOSITORY"
            echo "branche: $GITHUB_REF_NAME"
            echo "commit: $COMMIT"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "rustc: $(rustc -V)"
            echo "trunk: $(trunk --version)"
            echo "wasm-bindgen: $(wasm-bindgen --version)"
            echo "wasm-opt: $(wasm-opt --version)"
            echo "craft-fonts: $CRAFT_FONTS_REF"
          } > "$PKG/EVORA-BUILD.txt"
          { echo "work=$WORK"; echo "pkg=$PKG"; echo "out=$OUT"; } >> "$GITHUB_OUTPUT"

      - name: Porte des fichiers d'hébergement (bloquante)
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py hosting "$PKG" "$REPORT"

      - name: Porte des marques dans le bundle (E1, EVORA-CIC-01 ; bloquante)
        id: brands
        continue-on-error: true
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py brands "$PKG" "$REPORT" --strict

      - name: Porte du nom amont dans les couches d'affichage (E1, EVORA-CIC-01 ; bloquante)
        id: brands_ui
        continue-on-error: true
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py brands-ui "$GITHUB_WORKSPACE" "$PKG" "$REPORT"

      - name: Porte des liens sortants (E7, EVORA-CIC-05 ; bloquante)
        id: links
        continue-on-error: true
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py links "$GITHUB_WORKSPACE" "$REPORT"

      - name: Porte des émojis (E10, EVORA-CIC-06 ; bloquante)
        id: emojis
        continue-on-error: true
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py emojis "$GITHUB_WORKSPACE" "$REPORT" --strict

      - name: Porte des termes (E9, rapport jusqu'au catalogue de surcharge de la V2)
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/gates.py terms "$PKG" .github/evora/terms.txt "$REPORT"

      - name: Empreintes CSP, précompression et taille
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          OUT: ${{ steps.pkg.outputs.out }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          python3 -I .github/evora/gates.py csp "$PKG" "$OUT/csp-hashes.txt"
          cp "$OUT/csp-hashes.txt" "$PKG/csp-hashes.txt"
          python3 -I .github/evora/gates.py compress "$PKG"
          python3 -I .github/evora/gates.py sizes "$PKG" "$REPORT"
          { echo "### Empreintes CSP des scripts inline"; echo; sed 's/^/- `/; s/$/`/' "$OUT/csp-hashes.txt"; echo; } >> "$REPORT"

      - name: Fumée Chrome depuis une autre origine (base bloquante, témoin, CSP en rapport)
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          OUT: ${{ steps.pkg.outputs.out }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -I .github/evora/smoke.py "$PKG" "$OUT/csp-hashes.txt" "$GITHUB_WORKSPACE/evora-ci/smoke" "$REPORT"

      - name: Fumée « pont-ehp » du pont natif (EVORA-CIC-07 à CIC-10 ; bloquante)
        id: smoke_ehp
        continue-on-error: true
        timeout-minutes: 25
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: python3 -I .github/evora/smoke_ehp.py "$PKG" "$GITHUB_WORKSPACE/evora-ci/craft-fonts" "$GITHUB_WORKSPACE/evora-ci/smoke" "$REPORT"

      - name: Verdict des portes (ensemble exact des portes rouges)
        env:
          STORAGE: ${{ steps.storage.outcome }}
          BRANDS: ${{ steps.brands.outcome }}
          BRANDS_UI: ${{ steps.brands_ui.outcome }}
          LINKS: ${{ steps.links.outcome }}
          EMOJIS: ${{ steps.emojis.outcome }}
          SMOKE_EHP: ${{ steps.smoke_ehp.outcome }}
          LICENCES: ${{ needs.licences.result }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          red=""
          for pair in "stockage:$STORAGE" "marques:$BRANDS" "nom-amont-affichage:$BRANDS_UI" "liens:$LINKS" \
                      "emojis:$EMOJIS" "pont-ehp:$SMOKE_EHP" "job-licences:$LICENCES"; do
            [ "${pair#*:}" = "success" ] || red="$red ${pair%%:*}"
          done
          echo "PORTES ROUGES :${red:- aucune}" | tee -a "$REPORT"
          if [ -n "$red" ]; then
            echo "::error::portes rouges :$red"
            exit 1
          fi

      - name: Archive, SHA256SUMS
        env:
          NAME: ${{ steps.meta.outputs.name }}
          EPOCH: ${{ steps.meta.outputs.epoch }}
          WORK: ${{ steps.pkg.outputs.work }}
          PKG: ${{ steps.pkg.outputs.pkg }}
          OUT: ${{ steps.pkg.outputs.out }}
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          set -euo pipefail
          # Archive reproductible : dates fixées au commit, ordre trié, sans attributs étendus.
          find "$PKG" -exec touch -h -d "@$EPOCH" {} +
          (cd "$WORK" && find "$NAME" -print | LC_ALL=C sort | zip -X -9 -q -@ "$OUT/$NAME.zip")
          python3 -I .github/evora/gates.py hosting "$PKG" ""
          # Catalogue des commandes émis par le moteur pendant la fumée pont-ehp (command.catalog, DT-S17).
          cp "$GITHUB_WORKSPACE/evora-ci/smoke/commands.json" "$OUT/commands.json"
          (cd "$OUT" && sha256sum "$NAME.zip" csp-hashes.txt commands.json > SHA256SUMS)
          cat "$OUT/SHA256SUMS"
          {
            echo "### Archive (ligne de base)"
            echo
            echo "| Fichier | Octets | SHA-256 |"
            echo "|---|---|---|"
            for f in "$NAME.zip" csp-hashes.txt commands.json; do
              echo "| \`$f\` | $(stat -c %s "$OUT/$f") | \`$(sha256sum "$OUT/$f" | cut -d' ' -f1)\` |"
            done
            echo
          } >> "$REPORT"

      - name: Rapport des portes
        if: always()
        env:
          REPORT: ${{ steps.meta.outputs.report }}
        run: |
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT"
          fi

      - name: Artefact du run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: evora-ci/out/
          if-no-files-found: error

      - name: Traces de la fumée
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evora-smoke-${{ steps.meta.outputs.tag }}
          path: evora-ci/smoke/
          if-no-files-found: ignore
